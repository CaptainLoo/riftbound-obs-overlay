<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Riftbound OBS</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1117;
        color: #8a93a3;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        display: grid;
        place-items: center;
      }
      .box {
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 600;
        color: #e6e9ef;
      }
      p {
        margin: 0;
        font-size: 13px;
      }
      .bar {
        width: 160px;
        height: 3px;
        margin: 18px auto 0;
        background: #1f2632;
        border-radius: 2px;
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #6aa6ff;
        animation: slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Riftbound OBS</h1>
      <p>Starting the local server…</p>
      <div class="bar"></div>
    </div>
  </body>
</html>
